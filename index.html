<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Трекер</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: '#0a0a0a', panel: '#141414', border: '#262626',
            accent: '#eab308', textMuted: '#a3a3a3', success: '#22c55e', danger: '#ef4444'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    html, body, #root { height: 100%; margin: 0; }
    body {
      -webkit-tap-highlight-color: transparent;
      background: #0a0a0a; color: #ededed;
      overscroll-behavior-y: contain;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #404040; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef } = React;

    /* ===================== DATES ===================== */
    function isoDate(d = new Date()) {
      const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function addDays(iso, n) {
      const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoDate(d);
    }
    function daysBetween(a, b) {
      return Math.round(Math.abs(new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000);
    }
    function plural(n, one, few, many) {
      const m = n % 100, k = n % 10;
      if (m >= 11 && m <= 14) return many;
      if (k === 1) return one;
      if (k >= 2 && k <= 4) return few;
      return many;
    }
    function relativeTime(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 5) return 'только что';
      if (s < 60) return `${s} с`;
      if (s < 3600) return `${Math.floor(s / 60)} мин`;
      if (s < 86400) return `${Math.floor(s / 3600)} ч`;
      return `${Math.floor(s / 86400)} д`;
    }

    /* ===================== UTIL ===================== */
    function isDone(val) {
      if (val === true) return true;
      if (val && typeof val === 'object') return val.on === true;
      return false;
    }
    function b64encodeUnicode(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }
    function b64decodeUnicode(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    /* ===================== ANALYSIS ===================== */
    function currentStreak(habitId, completions, today = isoDate()) {
      let day = today;
      if (!isDone(completions[habitId]?.[day])) day = addDays(day, -1);
      let n = 0;
      while (isDone(completions[habitId]?.[day])) { n++; day = addDays(day, -1); }
      return n;
    }
    function weightSeriesInRange(weights, fromDate, toDate) {
      return Object.entries(weights || {})
        .filter(([d]) => d >= fromDate && d <= toDate)
        .map(([d, v]) => ({ date: d, kg: v.kg, ts: v.ts }))
        .sort((a, b) => a.date.localeCompare(b.date));
    }

    /* ===================== GITHUB REPO SYNC ===================== */
    const GH = 'https://api.github.com';
    const REPO_NAME = 'habits-tracker-data';
    const FILE_PATH = 'habits.json';

    function ghHeaders(token) {
      return {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json',
        'X-GitHub-Api-Version': '2022-11-28'
      };
    }
    async function ghVerify(token) {
      const r = await fetch(`${GH}/user`, { headers: ghHeaders(token) });
      if (r.status === 401) throw new Error('неверный токен или истёк');
      if (!r.ok) throw new Error(`github /user: ${r.status}`);
      return r.json();
    }
    async function ghGetRepo(token, owner, name) {
      const r = await fetch(`${GH}/repos/${owner}/${name}`, { headers: ghHeaders(token) });
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(`repo ${r.status}`);
      return r.json();
    }
    async function ghCreateRepo(token, name) {
      const r = await fetch(`${GH}/user/repos`, {
        method: 'POST', headers: ghHeaders(token),
        body: JSON.stringify({ name, private: true, auto_init: true, description: 'Tracker data' })
      });
      if (!r.ok) throw new Error('Ошибка создания репозитория. Проверь scope repo.');
      return r.json();
    }
    async function ghGetFile(token, owner, name, path) {
      const r = await fetch(`${GH}/repos/${owner}/${name}/contents/${path}`, { headers: ghHeaders(token) });
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(`file ${r.status}`);
      const data = await r.json();
      if (Array.isArray(data)) throw new Error('ожидался файл, пришёл каталог');
      return { content: b64decodeUnicode((data.content || '').replace(/\s/g, '')), sha: data.sha };
    }
    async function ghPutFile(token, owner, name, path, content, sha) {
      const body = { message: `tracker update ${new Date().toISOString()}`, content: b64encodeUnicode(content) };
      if (sha) body.sha = sha;
      const r = await fetch(`${GH}/repos/${owner}/${name}/contents/${path}`, {
        method: 'PUT', headers: ghHeaders(token), body: JSON.stringify(body)
      });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        const e = new Error(err?.message || `put ${r.status}`);
        e.status = r.status;
        throw e;
      }
      return r.json();
    }

    /* ===================== STATE + MERGE ===================== */
    function emptyState() {
      return {
        habits: [], completions: {}, deleted: {},
        weights: {}, weightDeleted: {},
        kcal: {}, kcalDeleted: {}, // Теперь kcal хранится как { [id]: { date, value, desc, ts } }
        settings: { kcalTarget: 2200, updatedAt: 0 }
      };
    }

    // Миграция старых калорий (где ключом был день) в новый формат (где ключ - UUID приема пищи)
    function migrateKcal(kObj) {
      if (!kObj) return {};
      const out = {};
      for (const [k, v] of Object.entries(kObj)) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && v && typeof v === 'object' && 'value' in v && !('date' in v)) {
          // Старый формат: '2026-11-01': { value, ts }
          out['legacy_' + k] = { id: 'legacy_' + k, date: k, value: v.value, desc: 'Приём пищи', ts: v.ts };
        } else if (v && typeof v === 'object' && 'date' in v) {
          // Новый формат
          out[k] = v;
        }
      }
      return out;
    }

    function mergeTimedMaps(a, b, aDel, bDel) {
      const out = {};
      for (const src of [a || {}, b || {}]) {
        for (const [k, v] of Object.entries(src)) {
          const ex = out[k];
          const nTs = (v && typeof v === 'object') ? (v.ts || 0) : 0;
          const oTs = (ex && typeof ex === 'object') ? (ex.ts || 0) : 0;
          if (!ex || nTs >= oTs) out[k] = v;
        }
      }
      const deleted = { ...(aDel || {}), ...(bDel || {}) };
      for (const [k, ts] of Object.entries(deleted)) {
        const v = out[k];
        if (v && (v.ts || 0) <= ts) delete out[k];
      }
      return { data: out, deleted };
    }

    function mergeSettings(a, b) {
      const A = a || { updatedAt: 0 }; const B = b || { updatedAt: 0 };
      const base = { kcalTarget: 2200 };
      return (A.updatedAt || 0) >= (B.updatedAt || 0) ? { ...base, ...B, ...A } : { ...base, ...A, ...B };
    }

    function mergeStates(a, b) {
      a = a || {}; b = b || {};
      
      const habitMap = new Map();
      for (const h of [...(a.habits || []), ...(b.habits || [])]) {
        const prev = habitMap.get(h.id);
        if (!prev || (h.updatedAt || 0) > (prev.updatedAt || 0)) habitMap.set(h.id, h);
      }
      const deleted = { ...(a.deleted || {}), ...(b.deleted || {}) };
      for (const [id, ts] of Object.entries(deleted)) {
        const h = habitMap.get(id);
        if (h && (h.updatedAt || 0) <= ts) habitMap.delete(id);
      }

      const comp = {};
      for (const src of [a.completions || {}, b.completions || {}]) {
        for (const [hid, dates] of Object.entries(src)) {
          if (!comp[hid]) comp[hid] = {};
          for (const [d, val] of Object.entries(dates)) {
            const ex = comp[hid][d];
            const nTs = (val && typeof val === 'object') ? (val.ts || 0) : 0;
            const oTs = (ex && typeof ex === 'object') ? (ex.ts || 0) : 0;
            if (!ex || nTs > oTs) comp[hid][d] = val;
          }
        }
      }
      for (const id of Object.keys(comp)) if (!habitMap.has(id)) delete comp[id];

      const w = mergeTimedMaps(a.weights, b.weights, a.weightDeleted, b.weightDeleted);
      
      // Миграция и мерж калорий
      const aKcalMigrated = migrateKcal(a.kcal);
      const bKcalMigrated = migrateKcal(b.kcal);
      const k = mergeTimedMaps(aKcalMigrated, bKcalMigrated, a.kcalDeleted, b.kcalDeleted);

      return {
        habits: [...habitMap.values()],
        completions: comp,
        deleted,
        weights: w.data, weightDeleted: w.deleted,
        kcal: k.data, kcalDeleted: k.deleted,
        settings: mergeSettings(a.settings, b.settings)
      };
    }

    function useHabitSync(token, owner) {
      const [state, setState] = useState(emptyState);
      const [loading, setLoading] = useState(true);
      const [syncing, setSyncing] = useState(false);
      const [lastSync, setLastSync] = useState(null);
      const [error, setError] = useState(null);

      const stateRef = useRef(state); stateRef.current = state;
      const lastShaRef = useRef(null);
      const writeTimer = useRef(null);
      const initialised = useRef(false);

      useEffect(() => {
        if (!token || !owner) return;
        let alive = true;
        (async () => {
          setLoading(true); setError(null);
          try {
            let repo = await ghGetRepo(token, owner, REPO_NAME);
            if (!repo) repo = await ghCreateRepo(token, REPO_NAME);
            if (!repo.private) throw new Error(`репозиторий ${owner}/${REPO_NAME} публичный — сделай его приватным`);

            const file = await ghGetFile(token, owner, REPO_NAME, FILE_PATH);
            let merged = stateRef.current;
            if (file) {
              merged = mergeStates(stateRef.current, JSON.parse(file.content));
              lastShaRef.current = file.sha;
            }
            if (alive) { setState(merged); setLastSync(Date.now()); initialised.current = true; }
            if (!file) {
              const res = await ghPutFile(token, owner, REPO_NAME, FILE_PATH, JSON.stringify(merged), null);
              lastShaRef.current = res?.content?.sha ?? null;
            } else if (JSON.stringify(merged) !== file.content) {
              const res = await ghPutFile(token, owner, REPO_NAME, FILE_PATH, JSON.stringify(merged), file.sha);
              lastShaRef.current = res?.content?.sha ?? null;
              if (alive) setLastSync(Date.now());
            }
          } catch (e) { if (alive) setError(e.message); }
          finally { if (alive) setLoading(false); }
        })();
        return () => { alive = false; };
      }, [token, owner]);

      useEffect(() => {
        if (!token || !owner || !initialised.current) return;
        if (writeTimer.current) clearTimeout(writeTimer.current);
        writeTimer.current = setTimeout(async () => {
          setSyncing(true);
          try {
            const local = stateRef.current;
            for (let attempt = 0; attempt < 2; attempt++) {
              const cur = await ghGetFile(token, owner, REPO_NAME, FILE_PATH);
              let toWrite = local;
              if (cur && cur.sha !== lastShaRef.current) {
                toWrite = mergeStates(local, JSON.parse(cur.content));
              }
              try {
                const res = await ghPutFile(token, owner, REPO_NAME, FILE_PATH, JSON.stringify(toWrite), cur?.sha ?? null);
                lastShaRef.current = res?.content?.sha ?? null;
                if (JSON.stringify(toWrite) !== JSON.stringify(local)) setState(toWrite);
                setLastSync(Date.now()); setError(null);
                break;
              } catch (e) {
                if (attempt === 0 && (e.status === 409 || e.status === 422)) continue;
                throw e;
              }
            }
          } catch (e) { setError(e.message); }
          finally { setSyncing(false); }
        }, 1500);
        return () => { if (writeTimer.current) clearTimeout(writeTimer.current); };
      }, [state, token, owner]);

      useEffect(() => {
        if (!token || !owner) return;
        let alive = true;
        async function poll() {
          if (document.hidden || !alive) return;
          try {
            const cur = await ghGetFile(token, owner, REPO_NAME, FILE_PATH);
            if (cur && cur.sha !== lastShaRef.current) {
              const merged = mergeStates(stateRef.current, JSON.parse(cur.content));
              lastShaRef.current = cur.sha;
              if (alive) { setState(merged); setLastSync(Date.now()); }
            }
          } catch {}
        }
        const iv = setInterval(poll, 25000);
        const onVis = () => { if (!document.hidden) poll(); };
        document.addEventListener('visibilitychange', onVis);
        return () => { alive = false; clearInterval(iv); document.removeEventListener('visibilitychange', onVis); };
      }, [token, owner]);

      async function forceSync() {
        if (!token || !owner) return;
        setSyncing(true);
        try {
          const cur = await ghGetFile(token, owner, REPO_NAME, FILE_PATH);
          let merged = stateRef.current, sha = null;
          if (cur) { merged = mergeStates(stateRef.current, JSON.parse(cur.content)); sha = cur.sha; }
          const res = await ghPutFile(token, owner, REPO_NAME, FILE_PATH, JSON.stringify(merged), sha);
          lastShaRef.current = res?.content?.sha ?? null;
          setState(merged); setLastSync(Date.now()); setError(null);
        } catch (e) { setError(e.message); }
        finally { setSyncing(false); }
      }

      return { state, setState, loading, syncing, lastSync, error, forceSync };
    }

    /* ===================== LOCAL STORAGE ===================== */
    const LS_TOKEN = 'habits_gh_token_v1';
    const LS_OWNER = 'habits_gh_owner_v1';

    /* ===================== ICONS ===================== */
    const IconDash = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>;
    const IconHabits = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>;
    const IconHealth = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>;
    const IconSettings = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
    const IconEdit = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;

    /* ===================== COMPONENTS ===================== */
    function SyncBadge({ syncing, lastSync, error, onSync }) {
      return (
        <button onClick={onSync} className="flex items-center gap-2 text-xs text-textMuted hover:text-accent transition px-3 py-1.5 rounded-lg border border-border bg-panel">
          {error ? <span className="text-danger">⚠ ошибка</span>
           : syncing ? <span className="text-accent">↻ синхронизация</span>
           : <><span className="w-1.5 h-1.5 rounded-full bg-success"></span> обновлено {lastSync ? relativeTime(lastSync) : '—'} назад</>}
        </button>
      );
    }

    function Stat({ label, value, sub, trend }) {
      return (
        <div className="bg-panel border border-border rounded-2xl p-5 flex flex-col justify-between">
          <div className="text-[11px] font-medium text-textMuted uppercase tracking-wider mb-3">{label}</div>
          <div className="flex items-baseline gap-2">
            <div className="text-2xl font-bold tracking-tight">{value}</div>
            {sub && <div className="text-xs text-textMuted">{sub}</div>}
          </div>
          {trend && <div className={`text-xs mt-1 font-medium ${trend.startsWith('+') ? 'text-success' : trend.startsWith('-') ? 'text-danger' : 'text-textMuted'}`}>{trend}</div>}
        </div>
      );
    }

    function DonutChart({ data }) {
      const total = data.reduce((a, d) => a + d.value, 0);
      if (total === 0) return <div className="w-32 h-32 rounded-full border-[10px] border-border flex items-center justify-center text-xs text-textMuted">пусто</div>;
      let cur = 0;
      const r = 56, C = 2 * Math.PI * r;
      return (
        <div className="relative w-36 h-36">
          <svg viewBox="0 0 140 140" className="w-full h-full -rotate-90">
            <circle cx="70" cy="70" r={r} fill="none" stroke="#262626" strokeWidth="16" />
            {data.map((d, i) => {
              if (d.value === 0) return null;
              const frac = d.value / total, dash = frac * C, offset = -cur * C;
              cur += frac;
              return <circle key={i} cx="70" cy="70" r={r} fill="none" stroke={d.color} strokeWidth="16" strokeDasharray={`${dash} ${C}`} strokeDashoffset={offset} className="transition-all duration-500" />;
            })}
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <div className="text-xl font-bold">{Math.round(total)}</div>
            <div className="text-[10px] text-textMuted uppercase">всего</div>
          </div>
        </div>
      );
    }

    function BarChart({ data, target }) {
      if (!data.length) return <div className="text-xs text-textMuted py-10 text-center">нет данных</div>;
      const max = Math.max(target || 0, ...data.map(d => d.value)) * 1.1;
      return (
        <div className="flex items-end gap-2 h-32 w-full">
          {data.map((d, i) => {
            const h = (d.value / max) * 100;
            const over = d.value > target;
            return (
              <div key={i} className="flex-1 flex flex-col items-center justify-end h-full gap-1 group relative">
                <div className="opacity-0 group-hover:opacity-100 absolute -top-6 text-[10px] bg-border px-1.5 py-0.5 rounded text-white pointer-events-none transition">{d.value}</div>
                <div className="w-full max-w-[24px] rounded-t-sm transition-all duration-500" style={{ height: `${h}%`, background: over ? '#ef4444' : '#eab308' }} />
                <div className="text-[9px] text-textMuted">{d.label}</div>
              </div>
            );
          })}
        </div>
      );
    }

    /* ===================== VIEWS ===================== */

    function DashboardTab({ sync, today }) {
      const state = sync.state;
      const activeHabits = state.habits.filter(h => !h.archived);
      const doneToday = activeHabits.filter(h => isDone(state.completions[h.id]?.[today])).length;
      
      const goal = state.settings?.kcalTarget || 2200;
      
      // Суммируем все приемы пищи за сегодня
      const todayKcal = Object.values(state.kcal).filter(k => k.date === today).reduce((sum, k) => sum + k.value, 0);
      const latestWeight = weightSeriesInRange(state.weights, '2000-01-01', today).pop()?.kg;

      const habitsData = activeHabits.map(h => ({ color: '#eab308', value: currentStreak(h.id, state.completions, today) }));

      const kcal7 = [];
      for (let i = 6; i >= 0; i--) {
        const d = addDays(today, -i);
        const daySum = Object.values(state.kcal).filter(k => k.date === d).reduce((sum, k) => sum + k.value, 0);
        kcal7.push({ label: d.slice(5), value: daySum });
      }

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <Stat label="Привычки сегодня" value={`${doneToday} / ${activeHabits.length}`} sub="выполнено" trend={doneToday === activeHabits.length && activeHabits.length > 0 ? "Всё готово!" : ""} />
            <Stat label="Калории сегодня" value={todayKcal} sub="ккал" trend={todayKcal > goal ? `+${todayKcal - goal} к цели` : goal - todayKcal > 0 ? `осталось ${goal - todayKcal}` : ""} />
            <Stat label="Вес" value={latestWeight ? latestWeight.toFixed(1) : '—'} sub="кг" trend={latestWeight ? "актуально" : "нет данных"} />
            <Stat label="Цель калорий" value={goal} sub="ккал/день" />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div className="bg-panel border border-border rounded-2xl p-5">
              <h3 className="text-[11px] font-medium text-textMuted uppercase tracking-wider mb-6">Серии привычек</h3>
              <div className="flex items-center gap-8">
                <DonutChart data={habitsData} />
                <div className="flex-1 space-y-3">
                  {activeHabits.slice(0, 5).map(h => (
                    <div key={h.id} className="flex items-center justify-between text-xs">
                      <span className="truncate pr-2">{h.name}</span>
                      <span className="font-mono text-accent shrink-0">🔥 {currentStreak(h.id, state.completions, today)}</span>
                    </div>
                  ))}
                  {activeHabits.length === 0 && <div className="text-xs text-textMuted">Добавь привычки</div>}
                </div>
              </div>
            </div>

            <div className="bg-panel border border-border rounded-2xl p-5">
              <h3 className="text-[11px] font-medium text-textMuted uppercase tracking-wider mb-6">Калории (7 дней)</h3>
              <BarChart data={kcal7} target={goal} />
            </div>
          </div>

          <div className="bg-panel border border-border rounded-2xl p-5">
            <h3 className="text-[11px] font-medium text-textMuted uppercase tracking-wider mb-4">Последние операции</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm">
                <thead>
                  <tr className="text-textMuted border-b border-border text-[10px] uppercase tracking-wider">
                    <th className="pb-3 font-medium">Дата</th>
                    <th className="pb-3 font-medium">Тип</th>
                    <th className="pb-3 font-medium">Значение</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-border">
                  {[...Object.entries(state.weights).map(([d, v]) => ({ date: d, type: 'Вес', val: v.kg + ' кг', ts: v.ts, color: 'text-white' })),
                    ...Object.values(state.kcal).map(k => ({ date: k.date, type: k.desc || 'Калории', val: k.value + ' ккал', ts: k.ts, color: 'text-accent' }))]
                    .sort((a, b) => b.ts - a.ts)
                    .slice(0, 5)
                    .map((op, i) => (
                      <tr key={i}>
                        <td className="py-3 text-textMuted font-mono text-xs">{op.date}</td>
                        <td className="py-3">{op.type}</td>
                        <td className={`py-3 font-medium ${op.color}`}>{op.val}</td>
                      </tr>
                    ))}
                  {Object.keys(state.weights).length === 0 && Object.keys(state.kcal).length === 0 && (
                    <tr><td colSpan="3" className="py-6 text-center text-textMuted text-xs">Нет записей. Добавь данные.</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function HabitsTab({ sync, today }) {
      const state = sync.state;
      const [modal, setModal] = useState(null); // null | 'new' | { id, name }
      const activeHabits = state.habits.filter(h => !h.archived).sort((a, b) => a.createdAt.localeCompare(b.createdAt));

      function toggleDate(habitId, date) {
        sync.setState(prev => {
          const now = Date.now();
          const c = { ...prev.completions };
          c[habitId] = { ...(c[habitId] || {}) };
          c[habitId][date] = { on: !isDone(c[habitId][date]), ts: now };
          return { ...prev, completions: c };
        });
      }

      function saveHabit(name, id) {
        if (id) {
          sync.setState(prev => ({
            ...prev,
            habits: prev.habits.map(h => h.id === id ? { ...h, name, updatedAt: Date.now() } : h)
          }));
        } else {
          sync.setState(prev => ({
            ...prev,
            habits: [...prev.habits, { id: crypto.randomUUID(), name, createdAt: isoDate(), updatedAt: Date.now(), archived: false }]
          }));
        }
        setModal(null);
      }

      function deleteHabit(id) { 
        if(confirm('Удалить?')) sync.setState(prev => ({ ...prev, habits: prev.habits.filter(h => h.id !== id), deleted: { ...prev.deleted, [id]: Date.now() } })); 
      }

      return (
        <div className="space-y-4 max-w-3xl">
          <div className="flex justify-end mb-2">
            <button onClick={() => setModal('new')} className="bg-accent text-base font-semibold px-4 py-2 rounded-lg text-sm hover:bg-yellow-500 transition">+ Добавить</button>
          </div>
          {activeHabits.map(h => {
            const done = isDone(state.completions[h.id]?.[today]);
            return (
              <div key={h.id} className="bg-panel border border-border rounded-xl p-4 flex items-center gap-4 group">
                <button onClick={() => toggleDate(h.id, today)} className={`w-10 h-10 rounded-full border-2 flex items-center justify-center shrink-0 transition ${done ? 'bg-accent border-accent text-base' : 'border-border text-transparent'}`}>
                  ✓
                </button>
                <div className="flex-1 min-w-0">
                  <div className="font-medium">{h.name}</div>
                  <div className="text-xs text-textMuted mt-0.5">🔥 {currentStreak(h.id, state.completions, today)} дней подряд</div>
                </div>
                <button onClick={() => setModal(h)} className="text-textMuted hover:text-accent px-2 text-sm transition"><IconEdit /></button>
                <button onClick={() => deleteHabit(h.id)} className="text-textMuted hover:text-danger px-2 text-sm transition">✕</button>
              </div>
            );
          })}
          {modal && <HabitModal initial={modal === 'new' ? null : modal} onSave={saveHabit} onClose={() => setModal(null)} />}
        </div>
      );
    }

    function HealthTab({ sync, today }) {
      const state = sync.state;
      const [subTab, setSubTab] = useState('weight'); // 'weight' | 'kcal'
      
      const [wDate, setWDate] = useState(today);
      const [wVal, setWVal] = useState('');
      
      const [kDate, setKDate] = useState(today);
      const [kVal, setKVal] = useState('');
      const [kDesc, setKDesc] = useState('Приём пищи');
      const [editKcalId, setEditKcalId] = useState(null);

      // --- WEIGHT LOGIC ---
      const addWeight = () => {
        const v = Number(wVal.replace(',', '.'));
        if (v < 20 || v > 400) return;
        sync.setState(prev => ({ 
          ...prev, 
          weights: { ...prev.weights, [wDate]: { kg: v, ts: Date.now() } },
          weightDeleted: Object.fromEntries(Object.entries(prev.weightDeleted).filter(([d]) => d !== wDate))
        }));
        setWVal('');
      };
      const editWeight = (d, v) => { setWDate(d); setWVal(String(v)); };
      const delWeight = (d) => {
        if(!confirm('Удалить запись?')) return;
        sync.setState(prev => {
          const w = { ...prev.weights }; delete w[d];
          return { ...prev, weights: w, weightDeleted: { ...prev.weightDeleted, [d]: Date.now() } };
        });
      };

      // --- KCAL LOGIC ---
      const addKcal = () => {
        const v = Number(kVal);
        if (v < 50 || v > 15000) return;
        
        if (editKcalId) {
          sync.setState(prev => ({
            ...prev,
            kcal: { ...prev.kcal, [editKcalId]: { id: editKcalId, date: kDate, value: v, desc: kDesc, ts: Date.now() } }
          }));
          setEditKcalId(null);
        } else {
          const id = crypto.randomUUID();
          sync.setState(prev => ({
            ...prev,
            kcal: { ...prev.kcal, [id]: { id, date: kDate, value: v, desc: kDesc, ts: Date.now() } }
          }));
        }
        setKVal(''); setKDesc('Приём пищи');
      };
      const editKcal = (k) => { setKDate(k.date); setKVal(String(k.value)); setKDesc(k.desc || 'Приём пищи'); setEditKcalId(k.id); };
      const delKcal = (id) => {
        if(!confirm('Удалить запись?')) return;
        sync.setState(prev => {
          const k = { ...prev.kcal }; delete k[id];
          return { ...prev, kcal: k, kcalDeleted: { ...prev.kcalDeleted, [id]: Date.now() } };
        });
      };

      // Группировка калорий по датам для отображения
      const kcalByDate = Object.values(state.kcal).reduce((acc, k) => {
        if (!acc[k.date]) acc[k.date] = [];
        acc[k.date].push(k);
        return acc;
      }, {});

      return (
        <div className="max-w-3xl space-y-6">
          {/* Подвкладки */}
          <div className="flex gap-2 p-1 bg-panel border border-border rounded-xl w-fit">
            <button onClick={() => setSubTab('weight')} className={`px-6 py-2 rounded-lg text-sm font-medium transition ${subTab === 'weight' ? 'bg-base text-accent' : 'text-textMuted hover:text-white'}`}>⚖ Вес</button>
            <button onClick={() => setSubTab('kcal')} className={`px-6 py-2 rounded-lg text-sm font-medium transition ${subTab === 'kcal' ? 'bg-base text-accent' : 'text-textMuted hover:text-white'}`}>🔥 Калории</button>
          </div>

          {subTab === 'weight' && (
            <div className="bg-panel border border-border rounded-2xl p-5 space-y-6">
              <h3 className="text-[11px] font-medium text-textMuted uppercase tracking-wider">Дневник веса</h3>
              <div className="flex gap-2">
                <input type="date" value={wDate} onChange={e=>setWDate(e.target.value)} className="bg-base border border-border rounded-lg px-3 py-2 text-sm outline-none focus:border-accent" />
                <input placeholder="кг" value={wVal} onChange={e=>setWVal(e.target.value)} className="flex-1 bg-base border border-border rounded-lg px-3 py-2 text-sm outline-none focus:border-accent" />
                <button onClick={addWeight} className="bg-accent text-base px-6 rounded-lg font-medium">ОК</button>
              </div>
              <div className="space-y-2 max-h-96 overflow-auto pr-2">
                {Object.entries(state.weights).sort((a,b) => b[0].localeCompare(a[0])).map(([d, v]) => (
                  <div key={d} className="flex justify-between items-center text-sm border-b border-border pb-2 group">
                    <span className="text-textMuted font-mono w-24">{d}</span>
                    <span className="font-medium flex-1">{v.kg} кг</span>
                    <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                      <button onClick={() => editWeight(d, v.kg)} className="text-textMuted hover:text-accent"><IconEdit /></button>
                      <button onClick={() => delWeight(d)} className="text-textMuted hover:text-danger">✕</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {subTab === 'kcal' && (
            <div className="bg-panel border border-border rounded-2xl p-5 space-y-6">
              <h3 className="text-[11px] font-medium text-textMuted uppercase tracking-wider">Дневник калорий</h3>
              <div className="flex flex-wrap gap-2">
                <input type="date" value={kDate} onChange={e=>setKDate(e.target.value)} className="bg-base border border-border rounded-lg px-3 py-2 text-sm outline-none focus:border-accent" />
                <select value={kDesc} onChange={e=>setKDesc(e.target.value)} className="bg-base border border-border rounded-lg px-3 py-2 text-sm outline-none focus:border-accent">
                  <option>Завтрак</option><option>Обед</option><option>Ужин</option><option>Перекус</option><option>Приём пищи</option>
                </select>
                <input placeholder="ккал" type="number" value={kVal} onChange={e=>setKVal(e.target.value)} className="flex-1 bg-base border border-border rounded-lg px-3 py-2 text-sm outline-none focus:border-accent min-w-[80px]" />
                <button onClick={addKcal} className="bg-accent text-base px-6 rounded-lg font-medium">
                  {editKcalId ? 'Сохранить' : 'ОК'}
                </button>
                {editKcalId && <button onClick={() => { setEditKcalId(null); setKVal(''); setKDesc('Приём пищи'); }} className="text-textMuted hover:text-white px-2">Отмена</button>}
              </div>

              <div className="space-y-6 max-h-96 overflow-auto pr-2">
                {Object.entries(kcalByDate).sort((a,b) => b[0].localeCompare(a[0])).map(([date, items]) => {
                  const total = items.reduce((sum, item) => sum + item.value, 0);
                  return (
                    <div key={date} className="bg-base border border-border rounded-xl p-4">
                      <div className="flex justify-between items-center border-b border-border pb-2 mb-2">
                        <span className="font-mono text-sm text-textMuted">{date}</span>
                        <span className="font-bold text-accent">{total} ккал</span>
                      </div>
                      <div className="space-y-2">
                        {items.sort((a,b) => a.ts - b.ts).map(k => (
                          <div key={k.id} className="flex justify-between items-center text-sm group">
                            <span className="text-textMuted w-24">{k.desc || 'Приём'}</span>
                            <span className="flex-1 text-right pr-4">{k.value}</span>
                            <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                              <button onClick={() => editKcal(k)} className="text-textMuted hover:text-accent"><IconEdit /></button>
                              <button onClick={() => delKcal(k.id)} className="text-textMuted hover:text-danger">✕</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    function SettingsTab({ sync, token, owner, onLogout }) {
      const [kcalInput, setKcalInput] = useState(String(sync.state.settings?.kcalTarget || 2200));
      const saveKcal = () => {
        const v = Number(kcalInput);
        if (!Number.isFinite(v)) return;
        sync.setState(prev => ({ ...prev, settings: { ...prev.settings, kcalTarget: v, updatedAt: Date.now() } }));
      };

      return (
        <div className="space-y-6 max-w-2xl">
          <div className="bg-panel border border-border rounded-2xl p-5">
            <h3 className="text-[11px] font-medium text-textMuted uppercase tracking-wider mb-4">Синхронизация</h3>
            <div className="flex items-center justify-between mb-4">
              <div className="text-sm">@{owner}</div>
              <a href={`https://github.com/${owner}/${REPO_NAME}`} target="_blank" className="text-xs text-accent hover:underline">Открыть репозиторий ↗</a>
            </div>
            <div className="text-xs text-textMuted truncate bg-base p-2 rounded border border-border font-mono">{token}</div>
          </div>

          <div className="bg-panel border border-border rounded-2xl p-5">
            <h3 className="text-[11px] font-medium text-textMuted uppercase tracking-wider mb-4">Цель по калориям</h3>
            <div className="flex gap-2">
              <input type="number" value={kcalInput} onChange={e=>setKcalInput(e.target.value)} className="bg-base border border-border rounded-lg px-3 py-2 text-sm outline-none focus:border-accent w-32" />
              <button onClick={saveKcal} className="bg-accent text-base px-4 rounded-lg font-medium">Сохранить</button>
            </div>
          </div>

          <button onClick={onLogout} className="w-full bg-panel border border-danger/30 text-danger hover:bg-danger/10 py-3 rounded-xl transition">Отключить аккаунт</button>
        </div>
      );
    }

    function HabitModal({ initial, onSave, onClose }) {
      const [name, setName] = useState(initial ? initial.name : '');
      return (
        <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50" onClick={onClose}>
          <div onClick={e=>e.stopPropagation()} className="bg-panel border border-border rounded-2xl p-5 w-full max-w-sm space-y-4">
            <h2 className="font-semibold">{initial ? 'Редактировать' : 'Новая'} привычка</h2>
            <input value={name} onChange={e=>setName(e.target.value)} autoFocus placeholder="Название" className="w-full bg-base border border-border rounded-lg px-3 py-2 text-sm outline-none focus:border-accent" />
            <div className="flex gap-2">
              <button onClick={onClose} className="flex-1 bg-base border border-border rounded-lg py-2 text-sm hover:bg-border/50">Отмена</button>
              <button onClick={() => { if(name.trim()) onSave(name.trim(), initial?.id); }} className="flex-1 bg-accent text-base font-medium rounded-lg py-2">Сохранить</button>
            </div>
          </div>
        </div>
      );
    }

    function AuthScreen({ onReady }) {
      const [token, setToken] = useState('');
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);

      async function submit(e) {
        e.preventDefault();
        if (!token.trim()) return;
        setBusy(true); setErr(null);
        try {
          const user = await ghVerify(token);
          localStorage.setItem(LS_TOKEN, token);
          localStorage.setItem(LS_OWNER, user.login);
          onReady(token, user.login);
        } catch (e) { setErr(e.message); }
        finally { setBusy(false); }
      }

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-sm bg-panel border border-border rounded-2xl p-6 shadow-2xl">
            <h1 className="text-2xl font-bold mb-1">Трекер</h1>
            <p className="text-xs text-textMuted mb-6">Войди через GitHub</p>
            <form onSubmit={submit} className="space-y-4">
              <input type="password" value={token} onChange={e=>setToken(e.target.value)} placeholder="ghp_..." className="w-full bg-base border border-border rounded-lg px-3 py-2 text-sm font-mono outline-none focus:border-accent" />
              {err && <div className="text-danger text-xs">{err}</div>}
              <button type="submit" disabled={busy} className="w-full bg-accent text-base font-semibold rounded-lg py-2.5 hover:bg-yellow-500 transition disabled:opacity-50">
                {busy ? '...' : 'Подключить'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    /* ===================== MAIN APP ===================== */
    const NAV = [
      { id: 'dash', label: 'Дашборд', icon: IconDash },
      { id: 'habits', label: 'Привычки', icon: IconHabits },
      { id: 'health', label: 'Здоровье', icon: IconHealth },
      { id: 'settings', label: 'Настройки', icon: IconSettings }
    ];

    function MainApp({ token, owner, onLogout }) {
      const sync = useHabitSync(token, owner);
      const [tab, setTab] = useState('dash');
      const today = isoDate();
      const [time, setTime] = useState(new Date());

      useEffect(() => {
        const iv = setInterval(() => setTime(new Date()), 1000);
        return () => clearInterval(iv);
      }, []);

      if (sync.loading) return <div className="min-h-screen flex items-center justify-center text-textMuted text-sm">Синхронизация...</div>;

      return (
        <div className="flex h-screen overflow-hidden bg-base text-white">
          <aside className="hidden md:flex flex-col w-64 border-r border-border bg-[#0a0a0a]">
            <div className="p-6">
              <h1 className="text-xl font-bold flex items-center gap-2">Трекер <span className="text-accent">●</span></h1>
            </div>

            {/* Время для Германии */}
            <div className="mx-4 mb-6 bg-panel border border-border rounded-xl p-4 text-center">
              <div className="text-2xl font-mono font-bold tracking-tight mb-1">
                {time.toLocaleTimeString('ru-RU', {hour12:false, timeZone: 'Europe/Berlin'})}
              </div>
              <div className="text-xs text-textMuted capitalize">
                {time.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Europe/Berlin' })}
              </div>
            </div>

            <nav className="flex-1 px-3 space-y-1">
              {NAV.map(item => {
                const active = tab === item.id;
                return (
                  <button key={item.id} onClick={() => setTab(item.id)}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition ${active ? 'bg-accent/10 text-accent font-medium' : 'text-textMuted hover:bg-panel hover:text-white'}`}>
                    <item.icon /> {item.label}
                  </button>
                );
              })}
            </nav>

            <div className="p-4 border-t border-border">
              <div className="text-[10px] text-textMuted leading-relaxed">
                Данные хранятся в приватном репозитории<br/>
                <span className="text-accent">@{owner}/{REPO_NAME}</span>
              </div>
            </div>
          </aside>

          <main className="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header className="flex items-center justify-between p-6 pb-4">
              <div>
                <h2 className="text-2xl font-bold flex items-center gap-2">Привет, @{owner} 👋</h2>
                <p className="text-xs text-textMuted mt-1">Твой прогресс и здоровье</p>
              </div>
              <SyncBadge syncing={sync.syncing} lastSync={sync.lastSync} error={sync.error} onSync={sync.forceSync} />
            </header>

            <div className="flex-1 overflow-auto p-6 pt-2">
              {sync.error && <div className="bg-danger/10 border border-danger/20 text-danger text-sm px-4 py-3 rounded-xl mb-6">{sync.error}</div>}
              
              {tab === 'dash' && <DashboardTab sync={sync} today={today} />}
              {tab === 'habits' && <HabitsTab sync={sync} today={today} />}
              {tab === 'health' && <HealthTab sync={sync} today={today} />}
              {tab === 'settings' && <SettingsTab sync={sync} token={token} owner={owner} onLogout={onLogout} />}
            </div>
          </main>

          <nav className="md:hidden fixed bottom-0 w-full bg-panel border-t border-border flex justify-around pb-safe z-50">
            {NAV.map(item => (
              <button key={item.id} onClick={() => setTab(item.id)} className={`flex flex-col items-center p-3 text-[10px] ${tab === item.id ? 'text-accent' : 'text-textMuted'}`}>
                <item.icon /> <span className="mt-1">{item.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    function App() {
      const [token, setToken] = useState(null);
      const [owner, setOwner] = useState(null);
      const [ready, setReady] = useState(false);

      useEffect(() => {
        const t = localStorage.getItem(LS_TOKEN);
        const o = localStorage.getItem(LS_OWNER);
        if (t && o) { setToken(t); setOwner(o); }
        setReady(true);
      }, []);

      if (!ready) return null;
      if (!token || !owner) return <AuthScreen onReady={(t, o) => { setToken(t); setOwner(o); }} />;
      return <MainApp token={token} owner={owner} onLogout={() => { localStorage.clear(); window.location.reload(); }} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
