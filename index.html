<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Habits</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body {
      -webkit-tap-highlight-color: transparent;
      background: #020617; color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      overscroll-behavior-y: contain;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    input, button, select, textarea { font-family: inherit; }
    @media (display-mode: standalone) {
      body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 1.2s linear infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    /* ===================== DATES ===================== */
    function isoDate(d = new Date()) {
      const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function addDays(iso, n) {
      const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoDate(d);
    }
    function daysBetween(a, b) {
      return Math.round(Math.abs(new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000);
    }
    function getWeekStart(iso) {
      const d = new Date(iso + 'T00:00:00');
      const dow = (d.getDay() + 6) % 7;
      return addDays(iso, -dow);
    }
    function plural(n, one, few, many) {
      const m = n % 100, k = n % 10;
      if (m >= 11 && m <= 14) return many;
      if (k === 1) return one;
      if (k >= 2 && k <= 4) return few;
      return many;
    }
    function relativeTime(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 5) return 'только что';
      if (s < 60) return `${s} с`;
      if (s < 3600) return `${Math.floor(s / 60)} мин`;
      if (s < 86400) return `${Math.floor(s / 3600)} ч`;
      return `${Math.floor(s / 86400)} д`;
    }

    /* ===================== TYPES ===================== */
    function isDone(val) {
      if (val === true) return true;
      if (val && typeof val === 'object') return val.on === true;
      return false;
    }

    /* ===================== ANALYSIS ===================== */
    function currentStreak(habitId, completions, today = isoDate()) {
      let day = today;
      if (!isDone(completions[habitId]?.[day])) day = addDays(day, -1);
      let n = 0;
      while (isDone(completions[habitId]?.[day])) { n++; day = addDays(day, -1); }
      return n;
    }
    function longestStreak(habitId, completions) {
      const dates = Object.entries(completions[habitId] || {}).filter(([, v]) => isDone(v)).map(([d]) => d).sort();
      if (!dates.length) return 0;
      let best = 1, cur = 1;
      for (let i = 1; i < dates.length; i++) {
        if (daysBetween(dates[i - 1], dates[i]) === 1) cur++; else cur = 1;
        if (cur > best) best = cur;
      }
      return best;
    }
    function completionRate(habitId, completions, days = 30) {
      let done = 0;
      for (let i = 0; i < days; i++) {
        if (isDone(completions[habitId]?.[addDays(isoDate(), -i)])) done++;
      }
      return done / days;
    }
    function totalDone(habitId, completions) {
      return Object.values(completions[habitId] || {}).filter(isDone).length;
    }

    /* ===================== COLORS ===================== */
    const COLORS = {
      emerald: { hex: '#34d399' }, sky: { hex: '#38bdf8' }, violet: { hex: '#a78bfa' },
      amber: { hex: '#fbbf24' }, rose: { hex: '#fb7185' }, teal: { hex: '#2dd4bf' }
    };
    const COLOR_KEYS = Object.keys(COLORS);
    const getColor = id => COLORS[id] || COLORS.emerald;

    /* ===================== GITHUB GIST SYNC ===================== */
    const GH = 'https://api.github.com';
    function ghHeaders(token) {
      return { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' };
    }

    async function ghVerify(token) {
      const r = await fetch(`${GH}/user`, { headers: ghHeaders(token) });
      if (r.status === 401) throw new Error('неверный токен или истёк');
      if (!r.ok) throw new Error(`github ${r.status}`);
      return r.json();
    }
    async function ghGetGist(token, id) {
      const r = await fetch(`${GH}/gists/${id}`, { headers: ghHeaders(token) });
      if (!r.ok) throw new Error(`gist ${r.status}`);
      return r.json();
    }
    async function ghListGists(token) {
      const r = await fetch(`${GH}/gists?per_page=100`, { headers: ghHeaders(token) });
      if (!r.ok) throw new Error(`list ${r.status}`);
      return r.json();
    }
    async function ghCreateGist(token, data) {
      const r = await fetch(`${GH}/gists`, {
        method: 'POST', headers: ghHeaders(token),
        body: JSON.stringify({
          description: 'habits-tracker-data',
          public: false,
          files: { 'habits.json': { content: JSON.stringify(data) } }
        })
      });
      if (!r.ok) throw new Error(`create ${r.status}`);
      return r.json();
    }
    async function ghUpdateGist(token, id, data) {
      const r = await fetch(`${GH}/gists/${id}`, {
        method: 'PATCH', headers: ghHeaders(token),
        body: JSON.stringify({ files: { 'habits.json': { content: JSON.stringify(data) } } })
      });
      if (!r.ok) throw new Error(`update ${r.status}`);
      return r.json();
    }

    async function ghFindOrCreate(token) {
      const list = await ghListGists(token);
      for (const g of list) {
        if (g.description === 'habits-tracker-data' && g.files?.['habits.json']) return g.id;
      }
      const created = await ghCreateGist(token, { habits: [], completions: {}, deleted: {} });
      return created.id;
    }

    function emptyState() { return { habits: [], completions: {}, deleted: {} }; }

    function mergeStates(a, b) {
      const habitMap = new Map();
      for (const h of [...(a.habits || []), ...(b.habits || [])]) {
        const prev = habitMap.get(h.id);
        if (!prev || (h.updatedAt || 0) > (prev.updatedAt || 0)) habitMap.set(h.id, h);
      }
      const deleted = { ...(a.deleted || {}), ...(b.deleted || {}) };
      for (const [id, ts] of Object.entries(deleted)) {
        const h = habitMap.get(id);
        if (h && (h.updatedAt || 0) <= ts) habitMap.delete(id);
      }
      const comp = {};
      for (const src of [a.completions || {}, b.completions || {}]) {
        for (const [hid, dates] of Object.entries(src)) {
          if (!comp[hid]) comp[hid] = {};
          for (const [d, val] of Object.entries(dates)) {
            const ex = comp[hid][d];
            const newTs = (val && typeof val === 'object') ? (val.ts || 0) : 0;
            const oldTs = (ex && typeof ex === 'object') ? (ex.ts || 0) : 0;
            if (!ex || newTs > oldTs) comp[hid][d] = val;
          }
        }
      }
      for (const id of Object.keys(comp)) if (!habitMap.has(id)) delete comp[id];
      return { habits: [...habitMap.values()], completions: comp, deleted };
    }

    function useHabitSync(token, gistId, setGistId) {
      const [state, setState] = useState(emptyState);
      const [loading, setLoading] = useState(true);
      const [syncing, setSyncing] = useState(false);
      const [lastSync, setLastSync] = useState(null);
      const [error, setError] = useState(null);

      const stateRef = useRef(state); stateRef.current = state;
      const gistIdRef = useRef(gistId); gistIdRef.current = gistId;
      const writeTimer = useRef(null);
      const lastRemoteAt = useRef(0);
      const initialised = useRef(false);

      // init
      useEffect(() => {
        if (!token) return;
        let alive = true;
        (async () => {
          setLoading(true); setError(null);
          try {
            let gid = gistId;
            if (!gid) { gid = await ghFindOrCreate(token); if (alive) setGistId(gid); }
            const gist = await ghGetGist(token, gid);
            const raw = gist.files?.['habits.json']?.content;
            const remote = raw ? JSON.parse(raw) : emptyState();
            const merged = mergeStates(stateRef.current, remote);
            if (alive) {
              setState(merged);
              setLastSync(Date.now());
              lastRemoteAt.current = new Date(gist.updated_at).getTime();
              initialised.current = true;
            }
            await ghUpdateGist(token, gid, merged);
          } catch (e) {
            if (alive) setError(e.message);
          } finally {
            if (alive) setLoading(false);
          }
        })();
        return () => { alive = false; };
      }, [token]);

      // debounced write on change
      useEffect(() => {
        if (!token || !gistIdRef.current || !initialised.current) return;
        if (writeTimer.current) clearTimeout(writeTimer.current);
        writeTimer.current = setTimeout(async () => {
          setSyncing(true);
          try {
            await ghUpdateGist(token, gistIdRef.current, stateRef.current);
            setLastSync(Date.now());
            setError(null);
          } catch (e) { setError(e.message); }
          finally { setSyncing(false); }
        }, 1500);
        return () => { if (writeTimer.current) clearTimeout(writeTimer.current); };
      }, [state, token]);

      // poll remote
      useEffect(() => {
        if (!token || !gistId) return;
        let alive = true;
        async function poll() {
          if (document.hidden || !alive) return;
          try {
            const gist = await ghGetGist(token, gistId);
            const remoteTs = new Date(gist.updated_at).getTime();
            if (remoteTs > lastRemoteAt.current) {
              const raw = gist.files?.['habits.json']?.content;
              if (raw) {
                const remote = JSON.parse(raw);
                const merged = mergeStates(stateRef.current, remote);
                if (alive) {
                  setState(merged);
                  setLastSync(Date.now());
                }
              }
              lastRemoteAt.current = remoteTs;
            }
          } catch { /* silent, retry next tick */ }
        }
        const iv = setInterval(poll, 25000);
        const onVis = () => { if (!document.hidden) poll(); };
        document.addEventListener('visibilitychange', onVis);
        return () => {
          alive = false;
          clearInterval(iv);
          document.removeEventListener('visibilitychange', onVis);
        };
      }, [token, gistId]);

      async function forceSync() {
        if (!token || !gistId) return;
        setSyncing(true);
        try {
          const gist = await ghGetGist(token, gistId);
          const raw = gist.files?.['habits.json']?.content;
          const remote = raw ? JSON.parse(raw) : emptyState();
          const merged = mergeStates(stateRef.current, remote);
          setState(merged);
          await ghUpdateGist(token, gistId, merged);
          lastRemoteAt.current = new Date(gist.updated_at).getTime();
          setLastSync(Date.now());
          setError(null);
        } catch (e) { setError(e.message); }
        finally { setSyncing(false); }
      }

      return { state, setState, loading, syncing, lastSync, error, forceSync };
    }

    /* ===================== STORAGE ===================== */
    const LS_TOKEN = 'habits_gh_token_v1';
    const LS_GIST = 'habits_gh_gist_v1';
    const LS_OWNER = 'habits_gh_owner_v1';

    async function hashToken(t) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
      return [...new Uint8Array(buf)].slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    /* ===================== AUTH SCREEN ===================== */
    function AuthScreen({ onReady }) {
      const [token, setToken] = useState('');
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);

      async function submit(e) {
        e.preventDefault();
        const t = token.trim();
        if (!t) return;
        setErr(null); setBusy(true);
        try {
          const user = await ghVerify(t);
          const h = await hashToken(t);
          const prevOwner = localStorage.getItem(LS_OWNER);
          if (prevOwner && prevOwner !== h) {
            // другой пользователь на этом устройстве — сбрасываем локальные данные
            localStorage.removeItem(LS_GIST);
          }
          localStorage.setItem(LS_OWNER, h);
          localStorage.setItem(LS_TOKEN, t);
          onReady(t);
        } catch (e) {
          setErr(e.message);
        } finally { setBusy(false); }
      }

      return (
        <div className="min-h-full flex items-center justify-center p-4">
          <div className="w-full max-w-sm">
            <div className="text-center mb-6">
              <h1 className="text-2xl font-bold">Habits</h1>
              <p className="text-slate-500 text-xs mt-1">синхронизация между устройствами через GitHub</p>
            </div>
            <form onSubmit={submit} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
              <label className="block text-xs text-slate-400">github token (scope: gist)
                <input type="password" value={token} onChange={e => setToken(e.target.value)}
                  placeholder="ghp_…" autoCapitalize="none" autoCorrect="off" spellCheck={false}
                  className="mt-1 w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm font-mono focus:border-emerald-500 outline-none" />
              </label>
              {err && <div className="text-amber-400 text-xs">{err}</div>}
              <button type="submit" disabled={busy}
                className="w-full bg-emerald-500 text-slate-950 font-semibold rounded-lg py-2.5 active:scale-[.99] transition disabled:opacity-50">
                {busy ? '…' : 'подключить'}
              </button>
              <div className="text-[11px] text-slate-500 leading-relaxed pt-1 space-y-1">
                <div>как получить токен:</div>
                <ol className="list-decimal list-inside space-y-0.5 text-slate-400">
                  <li>github.com/settings/tokens → generate new (classic)</li>
                  <li>отметь только scope <span className="font-mono text-emerald-400">gist</span></li>
                  <li>скопируй и вставь сюда</li>
                </ol>
                <div className="pt-1">на втором устройстве вводишь тот же токен — данные синхронизируются через приватный gist на твоём аккаунте.</div>
              </div>
            </form>
          </div>
        </div>
      );
    }

    /* ===================== SYNC INDICATOR ===================== */
    function SyncBadge({ syncing, lastSync, error, onSync }) {
      return (
        <button onClick={onSync} title={error || (lastSync ? 'обновлено ' + relativeTime(lastSync) : '')}
          className="text-xs px-2 py-1 rounded hover:bg-slate-800 transition flex items-center gap-1">
          {error ? <span className="text-amber-400">⚠</span>
           : syncing ? <span className="spin text-emerald-400">↻</span>
           : <span className="text-emerald-500">✓</span>}
          <span className="text-slate-500 text-[10px]">
            {error ? 'ошибка' : lastSync ? relativeTime(lastSync) : '—'}
          </span>
        </button>
      );
    }

    /* ===================== MINI CALENDAR ===================== */
    function MiniCalendar({ habitId, completions, color, days = 14 }) {
      const today = isoDate();
      const cells = [];
      for (let i = days - 1; i >= 0; i--) {
        const d = addDays(today, -i);
        cells.push({ d, done: isDone(completions[habitId]?.[d]) });
      }
      return (
        <div className="flex gap-[2px] mt-2">
          {cells.map(c => (
            <div key={c.d} title={c.d} style={{
              width: 8, height: 8, borderRadius: 2,
              background: c.done ? color.hex : '#1e293b'
            }} />
          ))}
        </div>
      );
    }

    /* ===================== HEATMAP ===================== */
    function Heatmap({ habitId, completions, today, color, onToggleDate }) {
      const weeks = 12;
      const grid = useMemo(() => {
        const endWeekStart = getWeekStart(today);
        const out = [];
        for (let w = weeks - 1; w >= 0; w--) {
          const weekStart = addDays(endWeekStart, -w * 7);
          const col = [];
          for (let d = 0; d < 7; d++) {
            const date = addDays(weekStart, d);
            col.push({ date, done: isDone(completions[habitId]?.[date]), future: date > today });
          }
          out.push(col);
        }
        return out;
      }, [habitId, completions, today]);

      const DOW = ['Пн', '', 'Ср', '', 'Пт', '', ''];
      return (
        <div className="overflow-x-auto">
          <div className="inline-flex gap-2">
            <div className="flex flex-col gap-1">
              {DOW.map((d, i) => (
                <div key={i} className="text-[9px] text-slate-500 h-[14px] leading-[14px]">{d}</div>
              ))}
            </div>
            <div className="flex gap-1">
              {grid.map((week, wi) => (
                <div key={wi} className="flex flex-col gap-1">
                  {week.map(cell => (
                    <button key={cell.date}
                      onClick={() => !cell.future && onToggleDate(habitId, cell.date)}
                      title={cell.date}
                      style={{
                        width: 14, height: 14, borderRadius: 3,
                        background: cell.future ? 'transparent' : (cell.done ? color : '#1e293b'),
                        opacity: cell.future ? 0.15 : 1,
                        cursor: cell.future ? 'default' : 'pointer',
                        border: 'none', padding: 0
                      }} />
                  ))}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* ===================== COMPONENTS ===================== */
    function Stat({ label, value }) {
      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 text-center">
          <div className="text-xl font-semibold">{value}</div>
          <div className="text-[10px] text-slate-500 mt-0.5">{label}</div>
        </div>
      );
    }

    function HabitRow({ habit, state, today, onToggle, onOpen }) {
      const color = getColor(habit.color);
      const done = isDone(state.completions[habit.id]?.[today]);
      const streak = currentStreak(habit.id, state.completions, today);
      return (
        <div className="flex items-center gap-3 bg-slate-900 border border-slate-800 rounded-xl p-3">
          <button onClick={onOpen} className="flex-1 text-left min-w-0">
            <div className="text-sm font-medium truncate">{habit.name}</div>
            <div className="text-[11px] mt-0.5" style={{ color: streak > 0 ? color.hex : '#64748b' }}>
              {streak > 0 ? `🔥 ${streak} ${plural(streak, 'день', 'дня', 'дней')} подряд` : 'нет серии'}
            </div>
            <MiniCalendar habitId={habit.id} completions={state.completions} color={color} />
          </button>
          <button onClick={() => onToggle(habit.id)} aria-label="отметить"
            style={{
              width: 48, height: 48, borderRadius: '50%',
              border: '2px solid ' + (done ? color.hex : '#475569'),
              background: done ? color.hex : 'transparent',
              color: done ? '#020617' : '#475569',
              fontSize: 22, fontWeight: 700,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer', flexShrink: 0, transition: 'all .15s ease'
            }}>
            {done ? '✓' : ''}
          </button>
        </div>
      );
    }

    function HabitDetail({ habit, state, today, onBack, onToggleDate, onDelete, onArchive }) {
      const color = getColor(habit.color);
      const streak = currentStreak(habit.id, state.completions, today);
      const best = longestStreak(habit.id, state.completions);
      const rate = completionRate(habit.id, state.completions, 30);
      const total = totalDone(habit.id, state.completions);
      return (
        <div className="p-4 space-y-4">
          <button onClick={onBack} className="text-sm text-slate-400 hover:text-slate-200">← назад</button>
          <div>
            <h1 className="text-xl font-semibold">{habit.name}</h1>
            <div className="text-xs text-slate-500 mt-1">создана {habit.createdAt}</div>
          </div>
          <div className="grid grid-cols-3 gap-2">
            <Stat label="серия" value={streak} />
            <Stat label="рекорд" value={best} />
            <Stat label="30 дней" value={Math.round(rate * 100) + '%'} />
          </div>
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-3">
            <div className="text-xs text-slate-400 mb-2">12 недель · клик переключает день</div>
            <Heatmap habitId={habit.id} completions={state.completions} today={today} color={color.hex} onToggleDate={onToggleDate} />
          </div>
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-baseline justify-between">
            <div className="text-xs text-slate-400">всего выполнено</div>
            <div className="text-2xl font-semibold" style={{ color: color.hex }}>
              {total} <span className="text-sm text-slate-500">{plural(total, 'раз', 'раза', 'раз')}</span>
            </div>
          </div>
          <div className="flex gap-2">
            <button onClick={() => onArchive(habit.id)}
              className="flex-1 bg-slate-800 hover:bg-slate-700 rounded-lg py-2 text-sm transition">
              {habit.archived ? 'разархивировать' : 'архивировать'}
            </button>
            <button onClick={() => { if (confirm('удалить привычку и всю историю?')) onDelete(habit.id); }}
              className="flex-1 bg-red-950/40 border border-red-900/60 text-red-300 hover:bg-red-950/60 rounded-lg py-2 text-sm transition">
              удалить
            </button>
          </div>
        </div>
      );
    }

    function NewHabitModal({ onSave, onClose }) {
      const [name, setName] = useState('');
      const [color, setColor] = useState('emerald');
      function submit(e) {
        e.preventDefault();
        const t = name.trim();
        if (!t) return;
        const now = Date.now();
        onSave({ id: crypto.randomUUID(), name: t, color, createdAt: isoDate(), updatedAt: now, archived: false });
      }
      return (
        <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50" onClick={onClose}>
          <form onClick={e => e.stopPropagation()} onSubmit={submit}
            className="bg-slate-900 border border-slate-800 rounded-2xl p-4 w-full max-w-sm space-y-3">
            <h2 className="text-base font-semibold">новая привычка</h2>
            <input value={name} onChange={e => setName(e.target.value)} autoFocus
              placeholder="например: 20 приседаний утром"
              className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:border-emerald-500 outline-none" />
            <div className="flex gap-2">
              {COLOR_KEYS.map(k => (
                <button key={k} type="button" onClick={() => setColor(k)}
                  style={{
                    background: COLORS[k].hex,
                    width: 36, height: 36, borderRadius: '50%',
                    outline: color === k ? '2px solid #fff' : 'none',
                    outlineOffset: 3, cursor: 'pointer', border: 'none'
                  }} />
              ))}
            </div>
            <div className="flex gap-2 pt-1">
              <button type="button" onClick={onClose}
                className="flex-1 bg-slate-800 hover:bg-slate-700 rounded-lg py-2 text-sm transition">отмена</button>
              <button type="submit"
                className="flex-1 bg-emerald-500 text-slate-950 font-medium rounded-lg py-2 text-sm active:scale-95 transition">создать</button>
            </div>
          </form>
        </div>
      );
    }

    /* ===================== MAIN APP ===================== */
    function MainApp({ token, gistId, setGistId, onLogout }) {
      const sync = useHabitSync(token, gistId, setGistId);
      const [view, setView] = useState({ type: 'list' });
      const [showNew, setShowNew] = useState(false);
      const [showArchived, setShowArchived] = useState(false);
      const [showMenu, setShowMenu] = useState(false);
      const today = isoDate();
      const state = sync.state;

      const activeHabits = state.habits.filter(h => !h.archived).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
      const archivedHabits = state.habits.filter(h => h.archived);
      const doneToday = activeHabits.filter(h => isDone(state.completions[h.id]?.[today])).length;
      const totalActive = activeHabits.length;
      const allDone = totalActive > 0 && doneToday === totalActive;

      function toggleDate(habitId, date) {
        sync.setState(prev => {
          const now = Date.now();
          const c = { ...prev.completions };
          c[habitId] = { ...(c[habitId] || {}) };
          const cur = isDone(c[habitId][date]);
          c[habitId][date] = { on: !cur, ts: now };
          return { ...prev, completions: c };
        });
      }
      function addHabit(habit) {
        sync.setState(prev => ({ ...prev, habits: [...prev.habits, habit] }));
        setShowNew(false);
      }
      function deleteHabit(id) {
        sync.setState(prev => {
          const now = Date.now();
          return {
            ...prev,
            habits: prev.habits.filter(h => h.id !== id),
            completions: Object.fromEntries(Object.entries(prev.completions).filter(([k]) => k !== id)),
            deleted: { ...prev.deleted, [id]: now }
          };
        });
        setView({ type: 'list' });
      }
      function archiveHabit(id) {
        sync.setState(prev => ({
          ...prev,
          habits: prev.habits.map(h => h.id === id ? { ...h, archived: !h.archived, updatedAt: Date.now() } : h)
        }));
        setView({ type: 'list' });
      }

      if (sync.loading) {
        return <div className="min-h-full flex items-center justify-center text-slate-500 text-sm">синхронизация…</div>;
      }

      if (view.type === 'detail') {
        const habit = state.habits.find(h => h.id === view.habitId);
        if (!habit) { setView({ type: 'list' }); return null; }
        return (
          <div className="min-h-full max-w-md mx-auto">
            <HabitDetail habit={habit} state={state} today={today}
              onBack={() => setView({ type: 'list' })}
              onToggleDate={toggleDate}
              onDelete={deleteHabit}
              onArchive={archiveHabit} />
          </div>
        );
      }

      return (
        <div className="min-h-full max-w-md mx-auto pb-24">
          <div className="p-4 space-y-4">
            <div className="flex items-center justify-between">
              <h1 className="text-xl font-semibold">привычки</h1>
              <div className="flex items-center gap-1">
                <SyncBadge syncing={sync.syncing} lastSync={sync.lastSync} error={sync.error} onSync={sync.forceSync} />
                <div className="relative">
                  <button onClick={() => setShowMenu(v => !v)}
                    className="text-slate-400 hover:text-slate-200 text-lg px-2 py-1">⋯</button>
                  {showMenu && (
                    <div className="absolute right-0 top-9 bg-slate-900 border border-slate-800 rounded-lg shadow-lg z-30 w-48">
                      <button onClick={() => { setShowMenu(false); onLogout(); }}
                        className="w-full text-left text-xs px-3 py-2 hover:bg-slate-800 rounded-lg text-red-300">
                        отключить аккаунт
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {sync.error && (
              <div className="bg-amber-950/40 border border-amber-900/60 text-amber-200 text-xs rounded-lg px-3 py-2">
                синхронизация: {sync.error}
              </div>
            )}

            {totalActive > 0 && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-3">
                <div className="flex justify-between text-xs text-slate-400 mb-1.5">
                  <span>{allDone ? '🎉 всё выполнено' : 'сегодня'}</span>
                  <span>{doneToday} / {totalActive}</span>
                </div>
                <div className="h-2 rounded-full bg-slate-800 overflow-hidden">
                  <div className="h-full rounded-full transition-all"
                    style={{ width: `${totalActive ? (doneToday / totalActive) * 100 : 0}%`, background: allDone ? '#34d399' : '#64748b' }} />
                </div>
              </div>
            )}

            {activeHabits.length === 0 && archivedHabits.length === 0 && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 text-center">
                <div className="text-slate-400 text-sm">пока пусто</div>
                <div className="text-slate-600 text-xs mt-1">нажми + чтобы создать первую привычку</div>
              </div>
            )}

            <div className="space-y-2">
              {activeHabits.map(h => (
                <HabitRow key={h.id} habit={h} state={state} today={today}
                  onToggle={id => toggleDate(id, today)}
                  onOpen={() => setView({ type: 'detail', habitId: h.id })} />
              ))}
            </div>

            {archivedHabits.length > 0 && (
              <div>
                <button onClick={() => setShowArchived(v => !v)} className="text-xs text-slate-500 hover:text-slate-300">
                  {showArchived ? '▾' : '▸'} архив ({archivedHabits.length})
                </button>
                {showArchived && (
                  <div className="space-y-2 mt-2">
                    {archivedHabits.map(h => (
                      <HabitRow key={h.id} habit={h} state={state} today={today}
                        onToggle={id => toggleDate(id, today)}
                        onOpen={() => setView({ type: 'detail', habitId: h.id })} />
                    ))}
                  </div>
                )}
              </div>
            )}

            <p className="text-[10px] text-slate-600 text-center leading-relaxed pt-2">
              данные синхронизируются через приватный gist на твоём github-аккаунте
            </p>
          </div>

          <button onClick={() => setShowNew(true)} aria-label="добавить привычку"
            className="fixed right-5 bg-emerald-500 text-slate-950 rounded-full shadow-lg active:scale-95 transition"
            style={{
              width: 60, height: 60, bottom: 'max(20px, env(safe-area-inset-bottom))',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 30, fontWeight: 700, border: 'none', cursor: 'pointer'
            }}>
            +
          </button>

          {showNew && <NewHabitModal onSave={addHabit} onClose={() => setShowNew(false)} />}
        </div>
      );
    }

    /* ===================== ROOT ===================== */
    function App() {
      const [token, setToken] = useState(null);
      const [gistId, setGistId] = useState(null);
      const [ready, setReady] = useState(false);

      useEffect(() => {
        const t = localStorage.getItem(LS_TOKEN);
        const g = localStorage.getItem(LS_GIST);
        if (t) { setToken(t); if (g) setGistId(g); }
        setReady(true);
      }, []);

      // persist gist id
      useEffect(() => {
        if (gistId) localStorage.setItem(LS_GIST, gistId);
      }, [gistId]);

      function logout() {
        localStorage.removeItem(LS_TOKEN);
        localStorage.removeItem(LS_GIST);
        // owner hash оставляем — чтобы при повторном входе того же пользователя
        // локальные данные не сбрасывались (их всё равно нет — данные в гисте)
        setToken(null); setGistId(null);
        window.location.reload();
      }

      if (!ready) return <div className="min-h-full flex items-center justify-center text-slate-500 text-sm">загрузка…</div>;
      if (!token) return <AuthScreen onReady={t => { setToken(t); setGistId(localStorage.getItem(LS_GIST)); }} />;
      return <MainApp token={token} gistId={gistId} setGistId={setGistId} onLogout={logout} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    /* ===================== SERVICE WORKER ===================== */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
